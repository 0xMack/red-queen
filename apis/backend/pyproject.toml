[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service exposing telemetry (runs/metrics/artifacts) and games to apps/frontend -- see docs/design/0005."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "telemetry",
    "games",
    "evolve",
    "modelpack",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[tool.uv.sources]
telemetry = { workspace = true }
games = { workspace = true }
evolve = { workspace = true }
modelpack = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
