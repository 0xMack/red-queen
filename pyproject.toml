[project]
name = "red-queen-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["libs/*", "apis/*"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]
notebooks = ["jupyter>=1", "matplotlib>=3"]

[tool.ruff]
target-version = "py311"
# The width the code was always hand-written at; `ruff format --check` and `ruff check` run in CI.
line-length = 120
# Notebooks (executed write-ups with baked-in output) and Markdown snippets: formatting them is churn, not cleanup.
extend-exclude = ["notebooks", "**/*.md", "**/.venv", "**/node_modules"]

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
