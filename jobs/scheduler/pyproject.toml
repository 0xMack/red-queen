[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scheduler"
version = "0.1.0"
description = "The scheduler workload: queued jobs into worker processes, experiments into jobs (docs/design/0018)."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "jobcore",
    "telemetry",
]

[tool.uv.sources]
jobcore = { workspace = true }
telemetry = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
