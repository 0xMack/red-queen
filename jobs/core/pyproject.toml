[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobcore"
version = "0.1.0"
description = "What every workload shares: the run sink, run lifecycle and control, job payload specs (docs/design/0018)."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "arena",
    "evolve",
    "pydantic>=2",
    "telemetry",
]

[tool.uv.sources]
arena = { workspace = true }
evolve = { workspace = true }
telemetry = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jobcore"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
