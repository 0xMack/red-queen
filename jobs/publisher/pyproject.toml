[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "publisher"
version = "0.1.0"
description = "The publisher workload: model packages into the model store, one PublishSpec at a time (docs/design/0018)."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "arena",
    "evaluator",
    "jobcore",
    "modelpack",
    "telemetry",
    "tinylm",
]

[tool.uv.sources]
arena = { workspace = true }
evaluator = { workspace = true }
jobcore = { workspace = true }
modelpack = { workspace = true }
telemetry = { workspace = true }
tinylm = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/publisher"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
