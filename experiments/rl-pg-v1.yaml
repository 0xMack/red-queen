# rl-pg-v1: converted from its recorded runs (docs/design/0018 stage 6b).
kind: experiment
name: rl-pg-v1
seeds: [0, 1, 2, 3, 4]
defaults:
  game: snake
  params:
    steps_per_iteration: 50000
    reward: shaped
arms:
  pg-reinforce:
    train:
      algorithm: rl.reinforce
      interface: snake/egocentric.v1+relative3.v1
      budget:
        iterations: 40
      held_out_every: 4
      params:
        snapshot_every: 40
        agent: {}
  pg-reinforce-baseline:
    train:
      algorithm: rl.reinforce
      interface: snake/egocentric.v1+relative3.v1
      budget:
        iterations: 40
      held_out_every: 4
      params:
        snapshot_every: 40
        agent:
          baseline: 1
    baseline: pg-reinforce
  pg-a2c:
    train:
      algorithm: rl.a2c
      interface: snake/egocentric.v1+relative3.v1
      budget:
        iterations: 40
      held_out_every: 4
      params:
        snapshot_every: 40
        agent: {}
    baseline: pg-reinforce-baseline
  pg-ppo:
    train:
      algorithm: rl.ppo
      interface: snake/egocentric.v1+relative3.v1
      budget:
        iterations: 40
      held_out_every: 4
      params:
        snapshot_every: 40
        agent: {}
    baseline: pg-a2c
  pg-ppo-ego2:
    train:
      algorithm: rl.ppo
      interface: snake/egocentric.v2+relative3.v1
      budget:
        iterations: 40
      held_out_every: 4
      params:
        snapshot_every: 40
        agent: {}
    baseline: pg-ppo
  pg-ppo-features16:
    train:
      algorithm: rl.ppo
      interface: snake/features.v1+relative3.v1
      budget:
        iterations: 40
      held_out_every: 4
      params:
        snapshot_every: 40
        agent:
          hidden: 16
          hidden_layers: 1
  pg-ppo-ego2-long:
    train:
      algorithm: rl.ppo
      interface: snake/egocentric.v2+relative3.v1
      budget:
        iterations: 200
      held_out_every: 20
      params:
        snapshot_every: 200
        agent: {}
    baseline: pg-ppo-ego2
report:
  protocol: experiment.rl-report
