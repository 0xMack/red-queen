# selfplay-v8 (prepared, not yet run; docs/design/0017): AlphaZero-style search targets. Each value head is compared with
# the TD-trained network it would replace, both searched by alpha-beta at 3 plies -- the question is whether a value
# learned from MCTS self-play is a better *evaluator*. `z-az-ft` fine-tunes the same 1M-game 2 x 64 TD networks TD-Leaf
# fine-tuned in `l-1m-ft2` (equal games: 40k; ~2.4x its compute at 50 simulations), and `z-az-ft-16k` matches that
# compute instead. `z-az-200k` learns from scratch, against TD-Leaf from scratch for the same 200k games (`s-leaf2`;
# ~1.75x its compute).
kind: experiment
name: selfplay-v8
seeds: [0, 1, 2, 3, 4]
defaults:
  game: checkers
  algorithm: alphazero
  params:
    games_per_iteration: 1000
    depth: 3
    agent: {hidden: 64, hidden_layers: 2, simulations: 50}
arms:
  z-az-ft:
    train:
      budget: {iterations: 40}
      held_out_every: 4
    baseline: selfplay-v6/l-1m-ft2
    init_from: selfplay-v2/pool-2x64-1m
  z-az-ft-16k:
    train:
      budget: {iterations: 16}
      held_out_every: 1
    baseline: selfplay-v6/l-1m-ft2
    init_from: selfplay-v2/pool-2x64-1m
  z-az-200k:
    train:
      budget: {iterations: 200}
      held_out_every: 20
    baseline: selfplay-v5/s-leaf2
report:
  protocol: experiment.checkers-h2h
  params: {full: true}
