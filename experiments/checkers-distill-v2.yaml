# checkers-distill-v2: converted from its recorded runs (docs/design/0018 stage 6b).
kind: experiment
name: checkers-distill-v2
seeds: [81, 82]
defaults:
  game: checkers
  algorithm: distill
  budget:
    generations: 300
  held_out_every: 10
  params:
    population_size: 100
    hidden: 16
    depth: 3
    label_depth: 6
    pool_games: 2000
    sample: 600
    sigma: 0.1
    mutation_rate: 0.1
    opponents: [material-3, material-4]
arms:
  distill-rollout:
    train:
      params:
        label_kind: rollout
  distill-blend:
    train:
      params:
        label_kind: blend
