# copycat-learned-v3: docs/design/0024 -- the fp32 output head. In copycat-learned-v1, S trained in fp32 beat bf16 by
# 0.8 dB on both seeds at 1.2-1.3 times the time. If the loss is in the 1,280 coordinate logits (which differ in the last
# bits of a bf16 product), computing only those in fp32 should recover most of it at bf16's speed. On the leading
# configuration: copycat-learned-v2's `m-warm4k` (25.84 dB), which this differs from in one setting.
kind: experiment
name: copycat-learned-v3
seeds: [1, 2]
defaults:
  game: copycat
  algorithm: copycat.svgformer
  budget:
    steps: 20000
  held_out_every: 4
  params:
    model: M
    batch: 64
    lr: 0.001
    warmup: 4000
    precision: bf16
    workers: 24
    log_every: 500
arms:
  m-warm4k-fp32head:
    baseline: copycat-learned-v2/m-warm4k
    train:
      params:
        fp32_head: true
