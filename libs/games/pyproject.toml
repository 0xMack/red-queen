[build-system]
# Mixed Rust/Python (docs/design/0009): the pure-Python modules under src/games plus the Rust game core
# as the `games._native` extension (rust/python). `uv sync` needs a Rust toolchain (cargo) to build it.
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "games"
version = "0.1.0"
description = "Toy games/simulations, one module per game, all implementing evolve.simulation.Environment."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.maturin]
manifest-path = "rust/python/Cargo.toml"
python-source = "src"
module-name = "games._native"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension whenever the Rust changes, not just when this file does -- otherwise
# `uv run` would keep importing a stale build of the game core.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "rust/**/Cargo.toml" },
    { file = "rust/**/*.rs" },
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
