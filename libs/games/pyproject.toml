[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "games"
version = "0.1.0"
description = "Toy games/simulations, one module per game, all implementing evolve.simulation.Environment."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/games"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
