[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinylm"
version = "0.1.0"
description = "A small transformer language model, built from scratch on libs/autodiff (docs/design/0004)."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "autodiff",
]

[tool.uv.sources]
autodiff = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tinylm"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
