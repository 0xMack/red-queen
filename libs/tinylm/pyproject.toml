[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinylm"
version = "0.1.0"
description = "A small transformer language model, built from scratch on libs/autodiff (docs/design/0004)."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "autodiff",
]

[tool.uv.sources]
autodiff = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tinylm"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
