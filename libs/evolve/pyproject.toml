[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evolve"
version = "0.1.0"
description = "Telemetry-agnostic evolutionary computation loop (genome, fitness, selection, variation) -- the Python prototype validated before anything is ported to C++."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/evolve"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
