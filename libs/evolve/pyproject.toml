[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evolve"
version = "0.1.0"
description = "Telemetry-agnostic evolutionary computation loop (genome, fitness, selection, variation) -- the Python prototype validated before anything is ported to C++."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/evolve"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
