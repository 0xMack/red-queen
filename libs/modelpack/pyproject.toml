[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelpack"
version = "0.1.0"
description = "Portable, content-addressed model packages (ONNX + manifest + weight shards) for client-side inference, docs/design/0009."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "evolve",
    "tinylm",
    "numpy>=2",
    "onnx>=1.17",
    "onnxruntime>=1.22",
    "pydantic>=2",
]

[tool.uv.sources]
evolve = { workspace = true }
tinylm = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/modelpack"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
