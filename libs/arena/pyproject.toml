[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena"
version = "0.1.0"
description = "Measurement as a domain: versioned evaluation protocols, their seed sets, two-player strength statistics, and training-cost measurement (docs/design/0018)."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "evolve",
    "games",
    "numpy>=2",
]

[tool.uv.sources]
evolve = { workspace = true }
games = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
