[build-system]
requires = [
    "scikit-build-core",
    "pybind11[global]>=2.13.6",
    "cmake",
    "ninja",  # optional but faster builds
]
build-backend = "scikit_build_core.build"

[project]
name = "redqueen"
version = "0.1.0"
description = "Simple C++ bindings to the Red Queen Genetic Algorithm library."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"}]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.optional-dependencies]
examples = ["scikit-learn", "numpy"]

[tool.scikit-build]
build-dir = "build"
wheel.packages = []
build.verbose = true

[tool.cibuildwheel]
test-command = "pytest {project}/tests"
test-extras = ["test"]
test-skip = ["*universal2:arm64"]
build-verbosity = 1

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
