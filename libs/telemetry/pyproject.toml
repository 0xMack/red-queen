[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetry"
version = "0.1.0"
description = "Run registry, metrics stream, and artifact store interfaces for observing evolving/training populations."
authors = [ { name = "Mack Preston", email = "mack.preston42@gmail.com"} ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry"]

[tool.ruff]
# One config for the whole repo (line length, rules, excludes) -- ruff uses the nearest pyproject.toml
# and does not inherit, so without this the root settings never reached this package.
extend = "../../pyproject.toml"
