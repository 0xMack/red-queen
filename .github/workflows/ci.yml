# Every check a change has to pass before it merges: the Python workspace (lint, format, tests -- which also
# hold the checked-in WASM build and the frontend's OpenAPI snapshot to the sources), the Rust game core
# (fmt, clippy, tests), and the frontend (generated API types current, typecheck, production build).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # a newer push supersedes a PR's run, but never cancels main's: that run may be deploying
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable # maturin builds games._native and rl._native during the sync
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            libs/games
            libs/rl
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag for this action
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install the workspace
        run: uv sync --all-packages --locked --extra mcp  # the CLI's MCP server is tested too
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest libs apis jobs/core jobs/trainer jobs/evaluator jobs/publisher jobs/scheduler jobs/tests
        env:
          REDQUEEN_GOLDEN_OUT: ${{ runner.temp }}/golden
      # The golden runs are exact per OS (libm differs); this run's digests, when they don't match -- or when there is
      # no fixture for this OS yet, which is how jobs/tests/golden/champions.linux.json is recorded.
      - name: Upload golden digests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-linux
          path: ${{ runner.temp }}/golden

  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The cores hold the unit tests; the PyO3 crates are extension modules (no libpython to link a test binary
          # against) and are exercised through the Python tests instead.
          - workspace: libs/games
            tests: -p redqueen-games
          - workspace: libs/rl
            tests: -p redqueen-rl -p redqueen-rl-envs
    name: rust (${{ matrix.workspace }})
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - uses: actions/setup-python@v7 # pyo3's build script needs an interpreter to configure against
        with:
          python-version: "3.11"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test ${{ matrix.tests }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json # its packageManager pin, shared with Cloudflare's build
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.node-version
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: |
          pnpm gen:api-types
          git diff --exit-code -- app/types/api.gen.ts
      - name: The browser's RL core trains exactly like the native one
        run: node scripts/check-rl-determinism.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Build the public site (static mode; fails on a file over 25 MiB or one carrying a local path)
        run: pnpm generate:static
        env:
          ORT_CHECK: warn # a PR uploads nothing: a new ONNX Runtime version goes to the data host when main deploys

  # The public site (docs/deploying.md): on every merge to main, once everything above passes, build it statically and
  # deploy the Worker that serves it. Its data -- a snapshot of the local stores -- can't come from here (the stores are
  # on the training machine): that's `redqueen publish site` + `redqueen dev deploy --no-site`, locally. Skips, with a
  # notice, until the deploy secrets are set.
  deploy:
    needs: [python, rust, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://redqueen.mackinations.ca
    concurrency:
      group: deploy-production
      cancel-in-progress: false # two merges in a row: the second waits, it never interrupts a deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Deploy secrets are set
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Site deploy skipped: set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (docs/deploying.md)."
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          package_json_file: apps/frontend/package.json
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: apps/frontend/.node-version
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.secrets.outputs.ready == 'true'
      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile
      - name: ONNX Runtime on the data host (uploads only files a new version adds)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          (cd apps/frontend && node scripts/build-static.mjs --stage-ort)
          uv run --script jobs/publisher/scripts/deploy_r2.py --ort-only --ort apps/frontend/.output/ort
      - name: Build the public site (strict -- the data host must serve its ONNX Runtime)
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/frontend
        run: pnpm generate:static
      - name: Deploy the site
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/frontend
        run: pnpm dlx wrangler@4 deploy
